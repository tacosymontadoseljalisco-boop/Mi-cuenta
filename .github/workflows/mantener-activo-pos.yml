name: Mantener activo Sistema POS

# Visita el POS y consulta su base de datos cada 6 horas para que
# Supabase (plan gratuito) no pause el proyecto por inactividad.
# La llave usada es la publica ("publishable") de la app, disenada
# para vivir en el navegador de cualquier cliente.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: https://uaperjykllcugmgbeyph.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_1GZJY46dqWaidBLnzE6e2Q_V78yuuVC

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar el POS en Vercel
        run: |
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 https://el-jalisco-pos.vercel.app/login)
          echo "Vercel /login -> HTTP $code"

      - name: Consultar la base de datos (Supabase)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "Supabase REST -> HTTP $code"
          if [ "$code" -ge 400 ] || [ "$code" -eq 000 ]; then
            echo "La base de datos no acepto la consulta (HTTP $code) — puede estar pausada o la llave cambio."
            exit 1
          fi

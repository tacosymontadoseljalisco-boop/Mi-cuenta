name: Mantener activo Sistema POS

# Visita el POS y consulta su base de datos cada 6 horas para que
# Supabase (plan gratuito) no pause el proyecto por inactividad.
# La llave usada es la publica ("publishable") de la app, disenada
# para vivir en el navegador de cualquier cliente.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: https://uaperjykllcugmgbeyph.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_1GZJY46dqWaidBLnzE6e2Q_V78yuuVC

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar el POS en Vercel
        run: |
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 https://el-jalisco-pos.vercel.app/login)
          echo "Vercel /login -> HTTP $code"

      - name: Consultar Supabase (mantiene el proyecto activo)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/health")
          echo "Supabase auth health -> HTTP $code"
          # Toque extra al API de datos; el codigo no importa, la visita cuenta
          rest=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/keepalive?select=*&limit=1")
          echo "Supabase REST -> HTTP $rest"
          if [ "$code" -ne 200 ]; then
            echo "Supabase no respondio bien (HTTP $code) — el proyecto puede estar pausado o la llave cambio."
            exit 1
          fi
